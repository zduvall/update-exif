[project]
name = "exif-cli"
version = "0.1.0"
description = "A command-line tool to read and update EXIF date metadata in photos."
dependencies = [
    "typer~=0.16.1",
    "piexif~=1.1.3",
]
readme = "README.md"
requires-python = ">=3.13"

[project.scripts]
exif = "main:app"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
